name: Proof Registry Phase 1

on:
  pull_request:
    paths:
      - "dfx.json"
      - "src/proof_registry/**"
      - "tests/proof_registry_e2e.py"
      - ".github/workflows/proof-registry.yml"
  workflow_dispatch:

jobs:
  proof-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dfinity/setup-dfx@main
        with:
          dfx-version: "0.30.1"
      - name: Verify DFX toolchain
        run: dfx --version
      - name: Start local ICP replica
        run: dfx start --background --clean
      - name: Compile and deploy isolated local registry
        run: dfx deploy proof_registry
      - name: Adversarial authority and immutability E2E
        run: python3 tests/proof_registry_e2e.py
      - name: Stop local replica
        if: always()
        run: dfx stop || true
