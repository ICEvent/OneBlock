name: Apply PR17 Final Review Fixes

on:
  push:
    branches:
      - fix/evidence-visibility-boundaries
    paths:
      - 'scripts/apply_pr17_final_review_fixes.py'
      - '.github/workflows/apply-pr17-final-review-fixes.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/evidence-visibility-boundaries
          fetch-depth: 0
      - name: Apply fixes
        run: python3 scripts/apply_pr17_final_review_fixes.py
      - name: Remove helper files
        run: rm scripts/apply_pr17_final_review_fixes.py .github/workflows/apply-pr17-final-review-fixes.yml
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: harden legacy activity migration' || exit 0
          git push
