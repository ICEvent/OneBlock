name: Backend CI

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/oneblock_backend/**'
      - 'dfx.json'
      - '.github/workflows/backend-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'src/oneblock_backend/**'
      - 'dfx.json'
      - '.github/workflows/backend-ci.yml'

permissions:
  contents: read

concurrency:
  # Keep only the newest lifecycle-token and migration-guard validation for each branch/ref.
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  motoko:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dfx
        uses: dfinity/setup-dfx@main

      - name: Show dfx version
        run: dfx --version

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned Motoko dependencies
        run: |
          npm install --global ic-mops@3.5.1
          mops install
      - name: Check profile canister
        run: dfx build --check profile
