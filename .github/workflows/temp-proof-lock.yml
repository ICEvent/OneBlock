name: Temporary proof lockfile generation

on:
  pull_request:
    paths:
      - "package.json"
      - ".github/workflows/temp-proof-lock.yml"

jobs:
  generate-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Resolve updated lockfile without executing install scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Emit lockfile for reviewed GitHub commit
        run: |
          node -e 'const d=require("fs").readFileSync("package-lock.json").toString("base64"); for(let i=0;i<d.length;i+=1000) console.log("LOCK_CHUNK:"+d.slice(i,i+1000));'
