name: Apply Profile Projection Privacy

on:
  push:
    branches:
      - fix/evidence-visibility-boundaries
    paths:
      - '.github/workflows/apply-profile-projection-privacy.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/evidence-visibility-boundaries

      - name: Apply privacy patch
        run: python3 scripts/apply_profile_projection_privacy.py

      - name: Validate diff
        run: git diff --check

      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: hide private evidence indexes from public profiles"
          git push origin HEAD:fix/evidence-visibility-boundaries
