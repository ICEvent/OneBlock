name: Temporary React lockfile repair

on:
  pull_request:
    paths:
      - "package.json"
      - "src/oneblock_frontend/package.json"
      - ".github/workflows/temp-react-lock.yml"

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Recompute React-singleton lock without install scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Confirm singleton in lock and emit bytes
        run: |
          node -e 'const fs=require("fs");const j=JSON.parse(fs.readFileSync("package-lock.json")); const r=Object.entries(j.packages).filter(([k,v])=>/\/(react|react-dom)$/.test(k)).map(([k,v])=>({k,version:v.version})); console.log("REACT_PACKAGES:"+JSON.stringify(r)); if(r.some(x=>x.version!=="18.3.1"))process.exit(1); const d=fs.readFileSync("package-lock.json").toString("base64"); for(let i=0;i<d.length;i+=1000)console.log("LOCK_CHUNK:"+d.slice(i,i+1000));'
