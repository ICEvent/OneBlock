name: Apply PR17 Legacy Provenance Fix

on:
  push:
    branches:
      - fix/evidence-visibility-boundaries
    paths:
      - '.github/workflows/apply-pr17-legacy-provenance-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/evidence-visibility-boundaries
          fetch-depth: 0

      - name: Apply reviewed fail-closed legacy provenance fix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/oneblock_backend/main.mo')
          text = path.read_text()
          start_marker = "            case null {\n                // Legacy records have no provenance marker."
          end_marker = "            };\n        }\n    };\n\n    private func callerOwnsActivityRecord"
          start = text.find(start_marker)
          if start < 0:
              raise SystemExit('legacy provenance fallback start marker not found')
          end_context = text.find(end_marker, start)
          if end_context < 0:
              raise SystemExit('legacy provenance fallback end marker not found')
          replacement = '''            case null {
                // Legacy records have no verifiable connection-incarnation provenance.
                // Timestamps from the current connection are insufficient because a
                // reusable profile ID may have inherited stale destination state.
                // Fail closed rather than guessing historical ownership.
                false
            };'''
          old_block = text[start:end_context + len("            };")]
          if old_block.count('getConnectionExact(profileId, record.app_id)') != 1:
              raise SystemExit('unexpected legacy fallback structure')
          path.write_text(text[:start] + replacement + text[end_context + len("            };"):])
          PY

      - name: Remove helper workflow
        run: rm .github/workflows/apply-pr17-legacy-provenance-fix.yml

      - name: Commit reviewed fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/oneblock_backend/main.mo .github/workflows/apply-pr17-legacy-provenance-fix.yml
          git commit -m 'fix: fail closed for legacy activity provenance'
          git push origin HEAD:fix/evidence-visibility-boundaries
