name: Apply PR17 Provider Idempotency And Signup Fix

on:
  push:
    branches:
      - fix/evidence-visibility-boundaries
    paths:
      - '.github/workflows/apply-pr17-provider-orphan-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/evidence-visibility-boundaries
          fetch-depth: 0

      - name: Apply reviewed product fix
        run: |
          echo '' | base64 -d > /tmp/pr17_patch.py
          python /tmp/pr17_patch.py

      - name: Self-review product diff before commit
        run: |
          git diff --check
          test "$(git diff --name-only | sort)" = "src/oneblock_backend/main.mo"
          grep -q 'idempotencyNamespacesMigratedV2' src/oneblock_backend/main.mo
          grep -q 'provider-idempotency:' src/oneblock_backend/main.mo
          grep -q 'reason == "provider_submission"' src/oneblock_backend/main.mo
          grep -q 'orphanedProfileIntegrationState.get(profileId)' src/oneblock_backend/main.mo
          grep -q 'purgeReusableProfileIntegrationStateIfNeeded(newProfile.id)' src/oneblock_backend/main.mo
          grep -q 'purgeReusableProfileIntegrationStateIfNeeded(nid)' src/oneblock_backend/main.mo
          ! grep -q 'private func providerIdemKey(providerId : Text, idem : Text) : Text { "provider:"' src/oneblock_backend/main.mo

      - name: Remove helper workflow
        run: rm .github/workflows/apply-pr17-provider-orphan-fix.yml

      - name: Commit reviewed fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/oneblock_backend/main.mo .github/workflows/apply-pr17-provider-orphan-fix.yml
          git commit -m 'fix: preserve provider replay guards and bound signup work'
          git push origin HEAD:fix/evidence-visibility-boundaries
