name: Apply PR17 Review Fixes

on:
  push:
    branches:
      - fix/evidence-visibility-boundaries
    paths:
      - 'scripts/apply_pr17_review_fixes.py'
      - '.github/workflows/apply-pr17-review-fixes.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/evidence-visibility-boundaries
      - name: Apply fixes
        run: python scripts/apply_pr17_review_fixes.py
      - name: Remove helper files
        run: |
          rm scripts/apply_pr17_review_fixes.py
          rm .github/workflows/apply-pr17-review-fixes.yml
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/oneblock_backend/main.mo scripts/apply_pr17_review_fixes.py .github/workflows/apply-pr17-review-fixes.yml
          git commit -m 'fix: harden legacy activity incarnation migration'
          git push