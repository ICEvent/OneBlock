name: Fix PR17 Summary Key

on:
  push:
    branches:
      - fix/evidence-visibility-boundaries
    paths:
      - 'scripts/fix-pr17-summary-key.py'
      - '.github/workflows/fix-pr17-summary-key.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/evidence-visibility-boundaries
          fetch-depth: 0

      - name: Apply reviewed fix
        run: python3 scripts/fix-pr17-summary-key.py

      - name: Remove helper files
        run: |
          rm scripts/fix-pr17-summary-key.py
          rm .github/workflows/fix-pr17-summary-key.yml

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/oneblock_backend/main.mo scripts/fix-pr17-summary-key.py .github/workflows/fix-pr17-summary-key.yml
          git commit -m 'fix: use collision-free summary keys on rename'
          git push origin HEAD:fix/evidence-visibility-boundaries
