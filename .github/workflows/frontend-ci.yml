name: Frontend CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/oneblock_frontend/**'
      - 'package.json'
      - 'package-lock.json'
      - 'sdk/**'
      - 'src/declarations/**'
      - 'scripts/harden-generated-agents.mjs'
      - 'tests/strictClaim.test.mjs'
      - 'tests/reactSingleton.test.mjs'
      - 'tests/validateSourceClaim.test.mjs'
      - '.github/workflows/frontend-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'src/oneblock_frontend/**'
      - 'package.json'
      - 'package-lock.json'
      - 'sdk/**'
      - 'src/declarations/**'
      - 'scripts/harden-generated-agents.mjs'
      - 'tests/strictClaim.test.mjs'
      - 'tests/reactSingleton.test.mjs'
      - 'tests/validateSourceClaim.test.mjs'
      - '.github/workflows/frontend-ci.yml'

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify single React runtime and Router hook compatibility
        run: node --test tests/reactSingleton.test.mjs

      - name: Check frontend dependency vulnerabilities
        run: npm audit --audit-level=moderate

      - name: Verify trusted IC root and safe environment allowlist
        run: node scripts/harden-generated-agents.mjs --check

      - name: Strict JSON, issuer and domain-schema validation
        run: node --test tests/strictClaim.test.mjs tests/validateSourceClaim.test.mjs

      - name: Type check
        run: npx tsc -p src/oneblock_frontend/tsconfig.json --noEmit

      - name: Build frontend
        working-directory: src/oneblock_frontend
        run: npx vite build
