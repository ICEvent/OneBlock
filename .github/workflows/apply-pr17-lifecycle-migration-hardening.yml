name: Apply PR17 Lifecycle Migration Hardening

on:
  push:
    branches:
      - fix/evidence-visibility-boundaries
    paths:
      - '.github/workflows/apply-pr17-lifecycle-migration-hardening.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/evidence-visibility-boundaries
          fetch-depth: 0

      - name: Apply reviewed migration hardening
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/oneblock_backend/main.mo')
          text = path.read_text()

          old_flags = """    var integrationCompositeKeysMigratedV1 : Bool = false;\n    var summaryCachesMigratedV1 : Bool = false;"""
          new_flags = """    var integrationCompositeKeysMigratedV1 : Bool = false;\n    var idempotencyCompositeKeysMigratedV1 : Bool = false;\n    var profileLifecycleTokensMigratedV1 : Bool = false;\n    var summaryCachesMigratedV1 : Bool = false;"""
          if text.count(old_flags) != 1:
              raise SystemExit('migration flag block missing or duplicated')
          text = text.replace(old_flags, new_flags, 1)

          old_lifecycle_migration = """        // Give every current profile a distinct internal lifecycle token. Legacy\n        // connections/records intentionally receive no token and must be re-authorized\n        // or fail closed; timestamps are not unique enough to prove incarnation.\n        for ((profileId, _) in profiles.entries()) {\n            switch (profileLifecycleIds.get(profileId)) {\n                case (?_) {};\n                case null {\n                    let lifecycleId = nextProfileLifecycleId();\n                    profileLifecycleIds.put(profileId, lifecycleId)\n                };\n            }\n        };"""
          new_lifecycle_migration = """        // Give every current profile a distinct internal lifecycle token once.\n        // Legacy connections/records intentionally receive no token and must be\n        // re-authorized or fail closed; timestamps are not unique incarnation IDs.\n        // Rebuild summary caches under this stricter provenance boundary even when\n        // an intermediate deployment had already marked the old cache migration done.\n        if (not profileLifecycleTokensMigratedV1) {\n            for ((profileId, _) in profiles.entries()) {\n                switch (profileLifecycleIds.get(profileId)) {\n                    case (?_) {};\n                    case null {\n                        let lifecycleId = nextProfileLifecycleId();\n                        profileLifecycleIds.put(profileId, lifecycleId)\n                    };\n                }\n            };\n            summaryCachesMigratedV1 := false;\n            profileLifecycleTokensMigratedV1 := true\n        };"""
          if text.count(old_lifecycle_migration) != 1:
              raise SystemExit('lifecycle migration block missing or duplicated')
          text = text.replace(old_lifecycle_migration, new_lifecycle_migration, 1)

          old_summary_key = """    private func summaryKey(profileId : Text, appId : Text, activityType : Text) : Text {\n        \"summary:\" # keyPart(profileId) # keyPart(appId) # keyPart(activityType)\n    };"""
          new_summary_key = """    private func summaryKey(profileId : Text, appId : Text, activityType : Text) : Text {\n        \"summary:\" # keyPart(profileId) # keyPart(appId) # keyPart(activityType)\n    };\n\n    private func idempotencyKey(appId : Text, externalKey : Text) : Text {\n        \"idempotency:\" # keyPart(appId) # keyPart(externalKey)\n    };"""
          if text.count(old_summary_key) != 1:
              raise SystemExit('summaryKey helper block missing')
          text = text.replace(old_summary_key, new_summary_key, 1)

          integration_end = """            integrationCompositeKeysMigratedV1 := true\n        };\n\n        // One-time compatibility migration for deployments created before the"""
          idempotency_migration = """            integrationCompositeKeysMigratedV1 := true\n        };\n\n        // Rebuild ambiguous legacy app:idempotency keys from the record's stored\n        // identity fields. The new length-prefixed key is collision-free.\n        if (not idempotencyCompositeKeysMigratedV1) {\n            idempotencyKeys := TrieMap.TrieMap<Text, Text>(Text.equal, Text.hash);\n            for (record in activityRecordsMap.vals()) {\n                idempotencyKeys.put(idempotencyKey(record.app_id, record.idempotency_key), record.id)\n            };\n            idempotencyCompositeKeysMigratedV1 := true\n        };\n\n        // One-time compatibility migration for deployments created before the"""
          if text.count(integration_end) != 1:
              raise SystemExit('integration migration end marker missing')
          text = text.replace(integration_end, idempotency_migration, 1)

          old_idem = "        let idemKey = newRecord.app_id # \":\" # newRecord.idempotency_key;"
          new_idem = "        let idemKey = idempotencyKey(newRecord.app_id, newRecord.idempotency_key);"
          if text.count(old_idem) != 1:
              raise SystemExit('legacy idempotency key construction missing or duplicated')
          text = text.replace(old_idem, new_idem, 1)

          required = [
              'profileLifecycleTokensMigratedV1',
              'summaryCachesMigratedV1 := false;',
              'idempotencyCompositeKeysMigratedV1',
              'private func idempotencyKey',
              'idempotencyKeys := TrieMap.TrieMap<Text, Text>',
              'idempotencyKey(record.app_id, record.idempotency_key)',
              'idempotencyKey(newRecord.app_id, newRecord.idempotency_key)',
          ]
          for needle in required:
              if needle not in text:
                  raise SystemExit(f'missing required migration hardening: {needle}')
          if 'newRecord.app_id # ":" # newRecord.idempotency_key' in text:
              raise SystemExit('ambiguous idempotency key remains')

          path.write_text(text)
          PY

      - name: Self-review product diff before commit
        run: |
          git diff --check
          test "$(git diff --name-only)" = "src/oneblock_backend/main.mo"
          git diff -- src/oneblock_backend/main.mo
          grep -q 'profileLifecycleTokensMigratedV1' src/oneblock_backend/main.mo
          grep -q 'idempotencyCompositeKeysMigratedV1' src/oneblock_backend/main.mo
          grep -q 'idempotencyKey(newRecord.app_id, newRecord.idempotency_key)' src/oneblock_backend/main.mo
          ! grep -q 'newRecord.app_id # ":" # newRecord.idempotency_key' src/oneblock_backend/main.mo

      - name: Remove helper workflow
        run: rm .github/workflows/apply-pr17-lifecycle-migration-hardening.yml

      - name: Commit reviewed migration hardening
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/oneblock_backend/main.mo .github/workflows/apply-pr17-lifecycle-migration-hardening.yml
          git diff --cached --check
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = ".github/workflows/apply-pr17-lifecycle-migration-hardening.yml src/oneblock_backend/main.mo "
          git commit -m 'fix: rebuild lifecycle caches and idempotency keys'
          git push origin HEAD:fix/evidence-visibility-boundaries
