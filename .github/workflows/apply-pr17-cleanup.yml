name: Apply PR17 Provenance Cleanup

on:
  push:
    branches:
      - fix/evidence-visibility-boundaries
    paths:
      - '.github/workflows/apply-pr17-cleanup.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/evidence-visibility-boundaries
          fetch-depth: 0

      - name: Apply reviewed cleanup
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/oneblock_backend/main.mo')
          text = path.read_text()

          record_sig = '''    private func recordBelongsToProfileIncarnation(
              profileId : ProfileId,
              profile : Profile,
              record : ActivityRecord
          ) : Bool {'''
          record_sig_new = '''    private func recordBelongsToProfileIncarnation(
              profile : Profile,
              record : ActivityRecord
          ) : Bool {'''
          if text.count(record_sig) != 1:
              raise SystemExit(f'unexpected record signature count: {text.count(record_sig)}')
          text = text.replace(record_sig, record_sig_new, 1)

          dirty_case = '''            case null {
      // Legacy records have no verifiable connection-incarnation provenance.
      // Timestamps from the current connection are insufficient because a
      // reusable profile ID may have inherited stale destination state.
      // Fail closed rather than guessing historical ownership.
      false
  };'''
          clean_case = '''            case null {
                // Legacy records have no verifiable connection-incarnation provenance.
                // Timestamps from the current connection are insufficient because a
                // reusable profile ID may have inherited stale destination state.
                // Fail closed rather than guessing historical ownership.
                false
            };'''
          if text.count(dirty_case) != 1:
              raise SystemExit(f'unexpected dirty case count: {text.count(dirty_case)}')
          text = text.replace(dirty_case, clean_case, 1)

          old_record_call = 'recordBelongsToProfileIncarnation(profileId, profile, record)'
          if text.count(old_record_call) != 3:
              raise SystemExit(f'unexpected record call count: {text.count(old_record_call)}')
          text = text.replace(old_record_call, 'recordBelongsToProfileIncarnation(profile, record)')

          can_read_sig = '''    private func canReadActivityRecord(
              caller : Principal,
              profileId : ProfileId,
              profile : Profile,
              record : ActivityRecord
          ) : Bool {'''
          can_read_sig_new = '''    private func canReadActivityRecord(
              caller : Principal,
              profile : Profile,
              record : ActivityRecord
          ) : Bool {'''
          if text.count(can_read_sig) != 1:
              raise SystemExit(f'unexpected canRead signature count: {text.count(can_read_sig)}')
          text = text.replace(can_read_sig, can_read_sig_new, 1)

          old_can_read_call = 'canReadActivityRecord(caller, profileId, profile, record)'
          if text.count(old_can_read_call) != 1:
              raise SystemExit(f'unexpected canRead call count: {text.count(old_can_read_call)}')
          text = text.replace(old_can_read_call, 'canReadActivityRecord(caller, profile, record)', 1)

          path.write_text(text)
          PY

      - name: Remove helper workflow
        run: rm .github/workflows/apply-pr17-cleanup.yml

      - name: Commit reviewed cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/oneblock_backend/main.mo .github/workflows/apply-pr17-cleanup.yml
          git commit -m 'refactor: clean activity provenance boundary'
          git push origin HEAD:fix/evidence-visibility-boundaries
